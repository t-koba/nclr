[package]
name = "nclr-backends"
version.workspace = true
edition.workspace = true
description = "nclr standard/controller backends: nclr-lba, nclr-sim, nclr-scsi, nclr-sd-native, nclr-controller"
license = "MIT OR Apache-2.0"

[[bin]]
name = "nclr-lba"
path = "src/bin/nclr-lba.rs"

[[bin]]
name = "nclr-sim"
path = "src/bin/nclr-sim.rs"

[[bin]]
name = "nclr-scsi"
path = "src/bin/nclr-scsi.rs"

[[bin]]
name = "nclr-sd-native"
path = "src/bin/nclr-sd-native.rs"

[[bin]]
name = "nclr-controller"
path = "src/bin/nclr-controller.rs"

[dependencies]
nclr-core = { path = "../nclr-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
serde_json = "1"
